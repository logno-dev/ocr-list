name: Android build

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          # The action defaults to 'tools platform-tools'; 'tools' is obsolete.
          packages: 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Set release version
        env:
          TAG: ${{ github.event.release.tag_name || github.ref_name }}
        run: |
          if [[ "$TAG" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            major=$((10#${BASH_REMATCH[1]}))
            minor=$((10#${BASH_REMATCH[2]}))
            patch=$((10#${BASH_REMATCH[3]}))
            if (( major > 2000 || minor > 999 || patch > 999 )); then
              echo 'Version components exceed supported bounds'; exit 1
            fi
            echo "VERSION_NAME=${TAG#v}" >> "$GITHUB_ENV"
            echo "VERSION_CODE=$((major * 1000000 + minor * 1000 + patch + 1))" >> "$GITHUB_ENV"
          elif [[ "$GITHUB_REF" == refs/tags/* || "$GITHUB_EVENT_NAME" == release ]]; then
            echo 'Release tags must use vMAJOR.MINOR.PATCH, for example v1.0.0'; exit 1
          fi
      - name: Test, lint, and build
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleRelease
      - name: Collect installable APK
        run: |
          mkdir -p artifacts
          cp app/build/outputs/apk/release/app-release.apk artifacts/OCR-List.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose artifacts/OCR-List.apk
      - uses: actions/upload-artifact@v4
        with:
          name: OCR-List
          path: artifacts/OCR-List.apk
      - name: Publish tag build
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || github.ref_name }}
        run: |
          if ! gh release view "$TAG" > /dev/null 2>&1; then
            gh release create "$TAG" --verify-tag --title "OCR List ${TAG#v}" --generate-notes
          fi
          gh release upload "$TAG" artifacts/OCR-List.apk --clobber
          # A rebuilt older release should not leave Obtainium with obsolete APK choices.
          gh release view "$TAG" --json assets --jq '.assets[].name' | while IFS= read -r asset; do
            case "$asset" in
              OCR-List-debug.apk|OCR-List-unsigned.apk) gh release delete-asset "$TAG" "$asset" --yes ;;
            esac
          done
